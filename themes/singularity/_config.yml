# 公众号二维码（文章末尾 + 首页）
wechat:
  name: 奇点以内
  qrcode: /images/qrcode-mp.png

# 首页「在线」一栏
links:
  - name: GitHub
    url: https://github.com/ChaoquanTao
    note: ChaoquanTao
  - name: 公众号
    url: /#follow
    note: 奇点以内

since: 2017

# Waline 评论 + 浏览量（服务端在 Vercel + Neon）
waline:
  comment: false   # 关闭评论区；文章浏览量仍由 Waline 统计。改成 true 即可重新开启
  serverURL: https://blog-comment-pi-navy.vercel.app
  js: https://unpkg.com/@waline/client@2.15.8/dist/waline.js
  css: https://unpkg.com/@waline/client@2.15.8/dist/waline.css
  placeholder: 留下你的足迹吧 ~
  meta: [nick, mail, link]
  requiredMeta: [nick]

# 站点 PV/UV（Vercount，兼容不蒜子的元素 id）
vercount: https://cn.vercount.one/js
