    url: /#posts
  - name: 归档
    url: /archives/
  - name: 分类
    url: /categories/
  - name: 标签
    url: /tags/
  - name: 关于
    url: /about/

# 首页开头
hero:
  title: 大音希声，大象无形。
  dek: Tau 的个人博客。早年写 Java 与后端，如今关注 Kubernetes、GPU 与 AI 训练 / 推理基础设施——尽量从第一性原理出发，把复杂的东西讲清楚。
  more:
